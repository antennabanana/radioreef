<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Interactive radio frequency bands reference — 15 kHz to 5 GHz spectrum with modulations, propagation and usage details.">
    <title>RF Spectrum // 15 kHz – 5 GHz</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='28' font-size='28'>📡</text></svg>">
    <style>
@font-face{font-family:'JetBrains Mono';font-style:normal;font-weight:300;font-display:swap;src:url('fonts/JetBrainsMono-Light.woff2') format('woff2'),local('JetBrains Mono Light')}
@font-face{font-family:'JetBrains Mono';font-style:normal;font-weight:400;font-display:swap;src:url('fonts/JetBrainsMono-Regular.woff2') format('woff2'),local('JetBrains Mono')}
@font-face{font-family:'JetBrains Mono';font-style:normal;font-weight:500;font-display:swap;src:url('fonts/JetBrainsMono-Medium.woff2') format('woff2'),local('JetBrains Mono Medium')}
@font-face{font-family:'JetBrains Mono';font-style:normal;font-weight:600;font-display:swap;src:url('fonts/JetBrainsMono-SemiBold.woff2') format('woff2'),local('JetBrains Mono SemiBold')}
@font-face{font-family:'JetBrains Mono';font-style:normal;font-weight:700;font-display:swap;src:url('fonts/JetBrainsMono-Bold.woff2') format('woff2'),local('JetBrains Mono Bold')}
</style>
<style>
/* ── reset & base ──────────────────────────────────────────────────────── */
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;font-family:'JetBrains Mono',monospace;background:#0a0a0f;color:#c8ccd0;font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}

/* ── scanline overlay ──────────────────────────────────────────────────── */
body::after{content:'';position:fixed;inset:0;pointer-events:none;z-index:9999;
  background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,.04) 2px,rgba(0,0,0,.04) 4px)}

/* ── app shell ─────────────────────────────────────────────────────────── */
.app{display:flex;flex-direction:column;height:100vh;width:100vw;overflow:hidden}

/* ── top bar ───────────────────────────────────────────────────────────── */
.top-bar{flex:0 0 32px;display:flex;align-items:center;padding:0 14px;
  background:linear-gradient(90deg,#0c0e16,#10131c);border-bottom:1px solid #1e2536;gap:10px;z-index:10}
.top-bar .title{font-size:14px;font-weight:600;letter-spacing:2px;text-transform:uppercase;color:#00ff88;white-space:nowrap;text-decoration:none;cursor:pointer;background:none;border:none;padding:0;font-family:'JetBrains Mono',monospace}
.top-bar .title:hover{animation:glitch .3s ease-in-out}
@keyframes glitch{0%{transform:translate(0)}20%{transform:translate(-2px,2px)}40%{transform:translate(-2px,-2px)}60%{transform:translate(2px,2px)}80%{transform:translate(2px,-2px)}100%{transform:translate(0)}}
.top-bar .range{font-size:12px;color:#9aaabe;letter-spacing:1px;white-space:nowrap}
.top-bar .dot{width:6px;height:6px;border-radius:50%;background:#00ff88;box-shadow:0 0 6px #00ff88;animation:blink 2s ease-in-out infinite;flex-shrink:0}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}

/* ── global search ──────────────────────────────────────────────────────── */
.search-wrap{
  flex:1;max-width:400px;display:flex;align-items:center;
  background:#0f1220;border:1px solid #1e2536;border-radius:3px;
  height:22px;padding:0 6px;gap:5px;transition:border-color .2s,box-shadow .2s;
}
.search-wrap:focus-within{border-color:#33ff88;box-shadow:0 0 6px rgba(0,255,136,.2)}
.search-tag{font-size:10px;letter-spacing:1px;text-transform:uppercase;color:#4a5a70;flex-shrink:0;font-family:'JetBrains Mono',monospace;pointer-events:none}
.search-wrap:focus-within .search-tag{color:#33ff88}
#globalSearch{
  flex:1;height:100%;background:none;border:none;
  color:#c8ccd0;font-family:'JetBrains Mono',monospace;
  font-size:12px;padding:0;outline:none;
}
#globalSearch::placeholder{color:#4a5a70}

/* ── main content area ─────────────────────────────────────────────────── */
.main{flex:1;display:flex;overflow:hidden;min-height:0}

/* ── left: band panel ──────────────────────────────────────────────────── */
.band-panel{flex:0 0 120px;display:flex;flex-direction:column;justify-content:safe center;gap:3px;padding:4px;
  background:linear-gradient(180deg,#0c0e16,#0e1018);border-right:1px solid #1a1f2e;z-index:5;overflow-y:auto;overflow-x:hidden}
.band-panel::-webkit-scrollbar{width:2px}
.band-panel::-webkit-scrollbar-thumb{background:#1e2536;border-radius:2px}

/* ── SC‑style band button ───────────────────────────────────────────────── */
.band-btn{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:4px 4px;cursor:pointer;user-select:none;transition:all .25s ease;flex-shrink:0;
  clip-path:polygon(6px 0,calc(100% - 6px) 0,100% 6px,100% calc(100% - 6px),calc(100% - 6px) 100%,6px 100%,0 calc(100% - 6px),0 6px);
  background:linear-gradient(180deg,#151a28 0%,#0f1220 50%,#151a28 100%)}
.band-btn .label{font-size:16px;font-weight:700;letter-spacing:2px;text-transform:uppercase;transition:color .25s}
.band-btn .freq{font-size:10px;color:#8a9aae;letter-spacing:.5px;margin-top:1px;transition:color .25s}
.band-btn:hover{filter:brightness(1.3)}
.band-btn:hover .label{color:#c0d0e0}
.band-btn.active{animation:pulse-glow 2.5s ease-in-out infinite}
.band-btn.active .label{font-weight:700}

/* per‑band accent colours (spectrum order) */
.band-btn[data-band="vlf"]  .label{color:#8a5050}.band-btn[data-band="vlf"].active  .label{color:#ff4444}
.band-btn[data-band="lf"]   .label{color:#8a6a40}.band-btn[data-band="lf"].active   .label{color:#ff8833}
.band-btn[data-band="mf"]   .label{color:#8a8030}.band-btn[data-band="mf"].active   .label{color:#ffc833}
.band-btn[data-band="hf"]   .label{color:#608a30}.band-btn[data-band="hf"].active   .label{color:#aaff33}
.band-btn[data-band="vhf"]  .label{color:#308a5a}.band-btn[data-band="vhf"].active  .label{color:#33ff88}
.band-btn[data-band="uhf"]  .label{color:#305a8a}.band-btn[data-band="uhf"].active  .label{color:#33aaff}
.band-btn[data-band="shf"]  .label{color:#60408a}.band-btn[data-band="shf"].active  .label{color:#aa66ff}

/* special tab buttons */
.band-btn[data-band="glossary"] .label{color:#5a6a7a}
.band-btn[data-band="glossary"].active .label{color:#88ccff}
.band-btn[data-band="glossary"]::after{background:#88ccff}
.band-btn[data-band="propagation"] .label{color:#5a6a7a}
.band-btn[data-band="propagation"].active .label{color:#ffaa44}
.band-btn[data-band="propagation"]::after{background:#ffaa44}
.band-btn[data-band="broadcast"] .label{color:#8a6a50}
.band-btn[data-band="broadcast"].active .label{color:#ff8844}
.band-btn[data-band="broadcast"]::after{background:#ff8844}
.band-btn[data-band="calc"] .label{color:#4a6a7a}
.band-btn[data-band="calc"].active .label{color:#44ccff}
.band-btn[data-band="calc"]::after{background:#44ccff}
.band-btn[data-band="search"] .label{color:#5a7a50}
.band-btn[data-band="search"].active .label{color:#88ff66}
.band-btn[data-band="search"]::after{background:#88ff66}
.band-btn[data-band="antennas"] .label{color:#7a4a6a}
.band-btn[data-band="antennas"].active .label{color:#ff66cc}
.band-btn[data-band="antennas"]::after{background:#ff66cc}

@keyframes pulse-glow{0%,100%{filter:drop-shadow(0 0 4px rgba(255,255,255,.15)) brightness(1.1)}50%{filter:drop-shadow(0 0 10px rgba(255,255,255,.25)) brightness(1.25)}}

/* small coloured bar under button */
.band-btn::after{content:'';position:absolute;bottom:2px;left:20%;right:20%;height:2px;border-radius:1px;opacity:.35;transition:opacity .25s}
.band-btn.active::after{opacity:.9}
.band-btn[data-band="vlf"]::after{background:#ff4444}
.band-btn[data-band="lf"]::after{background:#ff8833}
.band-btn[data-band="mf"]::after{background:#ffc833}
.band-btn[data-band="hf"]::after{background:#aaff33}
.band-btn[data-band="vhf"]::after{background:#33ff88}
.band-btn[data-band="uhf"]::after{background:#33aaff}
.band-btn[data-band="shf"]::after{background:#aa66ff}

/* separator line between bands and special tabs */
.band-sep{height:1px;background:linear-gradient(90deg,transparent,#1e2536,transparent);margin:2px 8px;flex-shrink:0}

/* ── middle: sub‑band panel ─────────────────────────────────────────────── */
.sub-panel{flex:0 0 0;overflow:hidden;transition:flex-basis .35s cubic-bezier(.4,0,.2,1),opacity .3s;opacity:0;
  display:flex;flex-direction:column;background:#0b0d15;border-right:1px solid #1a1f2e}
.sub-panel.open{flex-basis:210px;opacity:1}
.sub-panel-inner{display:flex;flex-direction:column;gap:3px;padding:6px;overflow-y:auto;overflow-x:hidden;flex:1;min-height:0}
.sub-panel-inner::-webkit-scrollbar{width:3px}
.sub-panel-inner::-webkit-scrollbar-thumb{background:#1e2536;border-radius:2px}
.sub-panel-header{font-size:12px;letter-spacing:1.5px;text-transform:uppercase;color:#9aaabe;padding:4px 8px 2px;white-space:nowrap;flex-shrink:0}

/* sub‑band button */
.sub-btn{position:relative;padding:5px 8px;cursor:pointer;user-select:none;font-size:13px;font-weight:500;
  color:#6a7a90;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:all .2s ease;
  clip-path:polygon(4px 0,calc(100% - 4px) 0,100% 4px,100% calc(100% - 4px),calc(100% - 4px) 100%,4px 100%,0 calc(100% - 4px),0 4px);
  background:linear-gradient(180deg,#13162200,#111420)}
.sub-btn:hover{background:linear-gradient(180deg,#1a1e30,#151828);color:#a0b0c8}
.sub-btn.active{color:#fff;background:linear-gradient(180deg,#181e32,#141a2c)}
.sub-btn .sub-freq{display:block;font-size:11px;color:#8a9aae;margin-top:1px;font-weight:400;transition:color .2s}
.sub-btn.active .sub-freq{color:#a0b0c8}

/* ── right: detail panel ────────────────────────────────────────────────── */
.detail-panel{flex:1;overflow:hidden;opacity:0;transition:opacity .3s ease .1s;display:flex;flex-direction:column;
  background:linear-gradient(135deg,#0a0c14,#0d0f18);min-width:0}
.detail-panel.open,.detail-panel:has(.intro){opacity:1}
.detail-inner{padding:12px 16px;overflow-y:auto;flex:1;min-height:0}
.detail-inner::-webkit-scrollbar{width:3px}
.detail-inner::-webkit-scrollbar-thumb{background:#1e2536;border-radius:2px}

/* detail: header */
.detail-title{font-size:20px;font-weight:700;letter-spacing:1px;margin-bottom:2px}
.detail-subtitle{font-size:12px;color:#9aaabe;letter-spacing:1px;text-transform:uppercase;margin-bottom:10px}

/* detail: data table */
.detail-table{width:100%;border-collapse:collapse;table-layout:auto}
.detail-table th{text-align:left;font-size:12px;font-weight:600;letter-spacing:1px;text-transform:uppercase;color:#9aaec4;
  padding:8px 12px;border-bottom:1px solid #1a1f2e;white-space:nowrap;vertical-align:top}
.detail-table td{font-size:14px;color:#d4e0ec;padding:8px 12px;border-bottom:1px solid #12151e;vertical-align:top;word-wrap:break-word;overflow-wrap:break-word}
.detail-table tr:last-child th,.detail-table tr:last-child td{border-bottom:none}

/* coloured accent bar in detail */
.accent-bar{height:3px;border-radius:1px;margin-bottom:10px;opacity:.7}

/* wavelength visual */
.wave-vis{display:flex;align-items:center;gap:6px;margin-top:8px;padding:6px 0}
.wave-vis svg{flex-shrink:0}
.wave-vis .wave-label{font-size:12px;color:#9aaabe;letter-spacing:.5px}

/* ── glossary terms in detail ───────────────────────────────────────────── */
.glossary-grid{display:grid;grid-template-columns:1fr 1fr;gap:0}
.glossary-item{padding:5px 10px;border-bottom:1px solid #12151e}
.glossary-item:nth-child(odd){border-right:1px solid #12151e}
.glossary-term{font-size:14px;font-weight:600;color:#88ccff;margin-bottom:1px}
.glossary-def{font-size:14px;color:#c0ccd8;line-height:1.4}
.glossary-cat{grid-column:1/-1;font-size:16px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:#ffaa44;padding:12px 10px 6px;border-bottom:2px solid #ffaa44}

/* ── antenna guide panel ────────────────────────────────────────────────── */
.ant-section{border:1px solid #1e2840;border-radius:3px;margin-bottom:14px;overflow:hidden}
.ant-header{display:flex;align-items:center;gap:10px;padding:8px 12px;background:linear-gradient(180deg,#141828,#111420);border-bottom:1px solid #1e2840}
.ant-name{font-size:14px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:#e0e8f0}
.ant-badge{font-size:10px;letter-spacing:.5px;padding:2px 6px;border-radius:2px;background:#ff66cc22;color:#ff66cc;border:1px solid #ff66cc44;margin-left:auto}
.ant-body{display:grid;grid-template-columns:180px 1fr;gap:12px;padding:12px;align-items:start}
.ant-svg-wrap{display:flex;flex-direction:column;align-items:center;gap:4px}
.ant-svg-label{font-size:10px;color:#5a7080;letter-spacing:.5px;text-align:center}
.ant-desc{font-size:14px;color:#c0ccd8;line-height:1.6;margin-bottom:10px}
.ant-props{display:grid;grid-template-columns:1fr 1fr;gap:4px 12px;margin-bottom:10px}
.ant-pro,.ant-con{font-size:13px;line-height:1.5;padding-left:14px;position:relative}
.ant-pro{color:#33ff88}.ant-pro::before{content:'▲';position:absolute;left:0;font-size:9px}
.ant-con{color:#ff6644}.ant-con::before{content:'▼';position:absolute;left:0;font-size:9px}
.ant-best{font-size:13px;color:#44ccff;background:#44ccff11;border:1px solid #44ccff33;border-radius:2px;padding:4px 8px;margin-bottom:8px}
.ant-null-note{font-size:13px;color:#ffaa44;background:#ffaa4411;border:1px solid #ffaa4433;border-radius:2px;padding:4px 8px}
@media(max-width:540px){.ant-body{grid-template-columns:1fr}}

/* ── propagation panel ──────────────────────────────────────────────────── */
.prop-section{margin-bottom:14px}
.prop-section h3{font-size:14px;font-weight:600;color:#ffaa44;letter-spacing:1px;margin-bottom:6px;text-transform:uppercase}
.prop-section p{font-size:14px;color:#c0ccd8;line-height:1.5;margin-bottom:4px}
.atmo-diagram{width:100%;max-width:900px}
.atmo-diagram text{font-family:'JetBrains Mono',monospace}
.world-map-wrap{position:relative;width:100%;max-width:900px;margin-top:6px}
.world-map-wrap svg{width:100%;height:auto}
.world-map-wrap text{font-family:'JetBrains Mono',monospace}
.prop-legend{display:flex;flex-wrap:wrap;gap:10px;margin-top:6px}
.prop-legend-item{display:flex;align-items:center;gap:4px;font-size:12px;color:#b0c0d0}
.prop-legend-swatch{width:10px;height:10px;border-radius:2px;flex-shrink:0}

/* ── placeholder / empty state ─────────────────────────────────────────── */
.empty-state{flex:1;display:flex;align-items:center;justify-content:center;color:#6a7a8e;font-size:14px;letter-spacing:2px;text-transform:uppercase;user-select:none}
.empty-state.intro{flex-direction:column;text-transform:none;letter-spacing:0;gap:0;padding:16px;max-width:520px;overflow:hidden;align-items:center;justify-content:center}
.intro-title{font-size:20px;font-weight:700;letter-spacing:2px;text-transform:uppercase;margin-bottom:8px}
.intro-wave{font-size:24px;letter-spacing:4px;margin-bottom:10px;opacity:.6;line-height:1}
.intro-line{font-size:12px;color:#7a8a9e;line-height:1.6;text-align:center}
.intro-line .key{display:inline-flex;align-items:center;justify-content:center;min-width:20px;height:18px;background:#1a1f2e;color:#a0b0c8;padding:0 4px;border-radius:3px;font-size:11px;font-weight:600;border:1px solid #2a3040;margin:0 1px;vertical-align:middle;line-height:1;font-family:'JetBrains Mono',monospace}
.intro-line .accent{color:#00ff88}
.intro-sep{width:40px;height:1px;background:linear-gradient(90deg,transparent,#2a3548,transparent);margin:6px auto}
html.light .intro-title{color:#4a5568}
html.light .intro-line{color:#5a6878}
html.light .intro-line .key{background:#dce0e8;color:#2a3040;border-color:#c0c8d4}
html.light .intro-line .accent{color:#00885a}
html.light .intro-sep{background:linear-gradient(90deg,transparent,#c0c8d4,transparent)}

/* ── well-known frequencies section ────────────────────────────────────── */
.wkf-section{margin-top:12px;border-top:1px solid #1a1f2e;padding-top:10px}
.wkf-section h3{font-size:13px;font-weight:600;color:#e0b888;letter-spacing:1px;text-transform:uppercase;margin-bottom:6px}
.wkf-region{margin-bottom:10px}
.wkf-region h4{font-size:12px;font-weight:600;letter-spacing:1px;text-transform:uppercase;margin-bottom:4px;padding:3px 8px;border-left:3px solid;display:inline-block}
.wkf-region h4.wkf-uk{color:#55aaff;border-color:#55aaff}
.wkf-region h4.wkf-usa{color:#ff6655;border-color:#ff6655}
.wkf-region h4.wkf-ru{color:#ffcc33;border-color:#ffcc33}
.wkf-region h4.wkf-de{color:#ffcc00;border-color:#ffcc00}
.wkf-region h4.wkf-fr{color:#4488ff;border-color:#4488ff}
.wkf-region h4.wkf-jp{color:#ff6688;border-color:#ff6688}
.wkf-region h4.wkf-au{color:#44ddaa;border-color:#44ddaa}
.wkf-region h4.wkf-ca{color:#ff8844;border-color:#ff8844}
.wkf-region h4.wkf-in{color:#ff9933;border-color:#ff9933}
.wkf-region h4.wkf-nl{color:#ff6600;border-color:#ff6600}
.wkf-table{width:100%;border-collapse:collapse;margin-bottom:6px}
.wkf-table th{text-align:left;font-size:11px;font-weight:600;letter-spacing:.5px;text-transform:uppercase;color:#d4a574;padding:4px 8px;border-bottom:1px solid #1a1f2e;white-space:nowrap}
.wkf-table td{font-size:14px;color:#c8ccd0;padding:3px 8px;border-bottom:1px solid #0e1118}
.wkf-table tr:last-child td{border-bottom:none}
.wkf-table .wkf-freq{color:#e8e0d8;font-weight:500;white-space:nowrap}
.wkf-table .wkf-mod{color:#d4a574;white-space:nowrap}

/* ── broadcast panel ────────────────────────────────────────────────────── */
.bc-controls{display:flex;gap:8px;align-items:flex-end;margin-bottom:12px;flex-wrap:wrap}
.bc-controls label{display:flex;flex-direction:column;gap:3px;font-size:11px;color:#9aaabe;letter-spacing:.5px}
.bc-controls input,.bc-controls select{
  background:#0f1220;border:1px solid #1e2536;color:#c8ccd0;
  font-family:'JetBrains Mono',monospace;font-size:12px;padding:3px 8px;outline:none;
  border-radius:3px;
}
.bc-controls input[list]{width:180px}
.bc-controls input[type="text"]:not([list]){width:120px}
.bc-controls button{
  background:linear-gradient(180deg,#1a2e38,#14222c);
  border:1px solid #ff8844;color:#ff8844;
  font-family:'JetBrains Mono',monospace;font-size:12px;
  padding:5px 14px;cursor:pointer;border-radius:3px;
}
.bc-controls button:hover{background:linear-gradient(180deg,#22384a,#1a2c38)}
.bc-result-table{width:100%;border-collapse:collapse}
.bc-result-table th{text-align:left;font-size:11px;color:#ff8844;letter-spacing:.5px;text-transform:uppercase;padding:4px 8px;border-bottom:1px solid #1a2030;white-space:nowrap}
.bc-result-table td{font-size:14px;color:#c8ccd0;padding:3px 8px;border-bottom:1px solid #0e1118;vertical-align:top}
.bc-result-table tr:last-child td{border-bottom:none}
.bc-result-table .bc-freq{color:#e8e0d8;font-weight:500;white-space:nowrap}
.bc-result-table .bc-station{color:#ff8844}
.bc-no-results{color:#6a7a8e;font-size:14px;padding:20px 0;text-align:center;letter-spacing:1px}

/* ── calculator panel ───────────────────────────────────────────────────── */
.calc-tabs{display:flex;gap:4px;margin-bottom:12px;flex-wrap:wrap}
.calc-tab{padding:5px 12px;cursor:pointer;font-size:12px;color:#6a7a90;
  border-radius:3px;border:1px solid #1e2840;
  background:linear-gradient(180deg,#13162200,#111420);transition:all .2s;user-select:none}
.calc-tab:hover{background:linear-gradient(180deg,#1a1e30,#151828);color:#a0b0c8;border-color:#2a3a54}
.calc-tab.active{color:#44ccff;background:linear-gradient(180deg,#181e32,#141a2c);border-color:#44ccff}
.calc-form{display:flex;gap:8px;align-items:flex-end;flex-wrap:wrap;margin-bottom:10px}
.calc-form label{display:flex;flex-direction:column;gap:3px;font-size:11px;color:#9aaabe;letter-spacing:.5px}
.calc-form input{
  background:#0f1220;border:1px solid #1e2536;color:#c8ccd0;
  font-family:'JetBrains Mono',monospace;font-size:13px;padding:4px 8px;
  outline:none;width:160px;border-radius:3px;
}
.calc-form button{
  background:linear-gradient(180deg,#1a2e3a,#142230);
  border:1px solid #44ccff;color:#44ccff;
  font-family:'JetBrains Mono',monospace;font-size:12px;
  padding:5px 14px;cursor:pointer;border-radius:3px;
}
.calc-form button:hover{background:linear-gradient(180deg,#22384a,#1a2c3a)}
.calc-result{padding:10px;background:linear-gradient(180deg,#0d1020,#0a0d18);
  border:1px solid #1a2030;margin-top:8px;min-height:40px;
  font-size:14px;color:#44ccff;line-height:1.9}
.calc-result .calc-key{color:#9aaabe;font-size:11px;letter-spacing:.5px}

/* ── State ──────────────────────────────────────────────────── */
let activeView = 'intro';   /* 'intro'|'band'|'glossary'|'propagation'|'broadcast'|'calc'|'search' */
let activeBand = null;      /* band id string | null */
let activeSub  = null;      /* sub-band name string | null */
let lastSearchQuery = '';

const $ = s => document.querySelector(s);

/* ── theme helpers ─────────────────────────────────────────── */
const LIGHT_COLORS = {
  '#ff4444':'#cc2222','#ff8833':'#cc6600','#ffc833':'#aa8800',
  '#aaff33':'#669900','#33ff88':'#00884a','#33aaff':'#0077cc',
  '#aa66ff':'#7744cc','#88ccff':'#2277cc','#ffaa44':'#cc7700',
  '#ff8844':'#cc5500','#44ccff':'#1155cc','#88ff66':'#117711'
};
function isLight(){ return document.documentElement.classList.contains('light'); }
function tc(c){ return isLight() ? (LIGHT_COLORS[c]||c) : c; }

function toggleTheme(){
  document.documentElement.classList.toggle('light');
  try{ localStorage.setItem('rf-theme', isLight()?'light':'dark'); }catch(e){}
  refreshCurrentView();
}

function refreshCurrentView(){
  if(activeView === 'glossary') openGlossary();
  else if(activeView === 'propagation') openPropagation();
  else if(activeView === 'broadcast') openBroadcast();
  else if(activeView === 'calc') openCalc();
  else if(activeView === 'search') openSearch(lastSearchQuery);
  else if(activeView === 'antennas') openAntennas();
  else if(activeView === 'band' && activeBand){
    var band = BANDS.find(function(b){ return b.id === activeBand; });
    if(band && activeSub){
      var sub = band.subs.find(function(s){ return s.name === activeSub; });
      var el = document.querySelector('#subInner .sub-btn.active');
      if(sub && el) selectSub(band, sub, el);
    }
  } else showIntro();
}

(function initTheme(){
  try{ if(localStorage.getItem('rf-theme')==='light') document.documentElement.classList.add('light'); }catch(e){}
})();

function showIntro(){
  var el = $('#emptyState');
  el.className = 'empty-state intro';
  el.style.display = 'flex';
  el.innerHTML =
    '<div class="intro-wave">∿∿∿ 📡 ∿∿∿</div>'+
    '<div class="intro-title" style="color:'+ tc('#33ff88') +'">RF Spectrum Explorer</div>'+
    '<div class="intro-line">Your pocket guide to <span class="accent">' + BANDS.reduce(function(n,b){return n+b.subs.length;},0) + ' sub‑bands</span> from 15 kHz to 5 GHz.</div>'+
    '<div class="intro-sep"></div>'+
    '<div class="intro-line">Pick a band on the left — or just smash the keyboard:</div>'+
    '<div class="intro-sep"></div>'+
    '<div class="intro-line"><span class="key">↑</span> <span class="key">↓</span> hop between bands</div>'+
    '<div class="intro-line"><span class="key">→</span> enter · <span class="key">↑</span><span class="key">↓</span><span class="key">→</span> browse sub‑bands</div>'+
    '<div class="intro-line"><span class="key">←</span> back to band from any sub‑band</div>'+
    '<div class="intro-line"><span class="key">/</span> global search · <span class="key">D/L</span> dark/light toggle</div>'+
    '<div class="intro-sep"></div>'+
    '<div class="intro-line" style="opacity:.5">Also try <strong>ABC</strong> (glossary), <strong>PROP</strong> (propagation), <strong>BC</strong> (shortwave), <strong>CALC</strong> (calculators)</div>';
}

/* ── count total sub-bands ───────────────────────────────── */
const totalSubs = BANDS.reduce((n, b) => n + b.subs.length, 0);
$('#bandCount').textContent = BANDS.length + ' bands / ' + totalSubs + ' entries';

showIntro();

/* ── build band buttons ──────────────────────────────────── */
const bandPanel = $('#bandPanel');
BANDS.forEach(b => {
  const el = document.createElement('div');
  el.className = 'band-btn';
  el.dataset.band = b.id;

  el.addEventListener('click', () => selectBand(b));
  bandPanel.appendChild(el);
});

/* ── wavelength SVG vis (fixed unit handling) ─────────────── */
function waveVis(wlText, color) {
  const num = parseFloat(wlText);
  if (isNaN(num)) return '';
  let numInMeters = num;
  if (wlText.includes('km'))       numInMeters = num * 1000;
  else if (wlText.includes('cm'))  numInMeters = num / 100;
  else if (wlText.includes('mm'))  numInMeters = num / 1000;
  /* else assume metres */
  const cycles = Math.max(1, Math.min(12, Math.round(8 - Math.log10(numInMeters))));
  const w = 200, h = 30;
  let path = 'M0,' + (h/2);
  for (let i = 0; i <= cycles * 20; i++) {
    const x = (i / (cycles * 20)) * w;
    const y = h/2 + Math.sin((i / 20) * Math.PI * 2) * (h/2 - 2);
    path += ' L' + x.toFixed(1) + ',' + y.toFixed(1);
  }
  return '<div class="wave-vis">' +
    '<svg width="' + w + '" height="' + h + '" viewBox="0 0 ' + w + ' ' + h + '">' +
      '<path d="' + path + '" fill="none" stroke="' + tc(color) + '" stroke-width="1.5" opacity=".5"/>' +
    '</svg>' +
    '<span class="wave-label">λ ≈ ' + wlText + '</span>' +
  '</div>';
}

/* ── WKF helpers ─────────────────────────────────────────── */
function parseFreqMHz(s) {
  var nums = s.match(/[\d.]+/g);
  if (!nums) return null;
  var unit = 1;
  if (/GHz/i.test(s)) unit = 1000;
  else if (/MHz/i.test(s)) unit = 1;
  else if (/kHz/i.test(s)) unit = 0.001;
  var lo = parseFloat(nums[0]) * unit;
  var hi = nums.length > 1 ? parseFloat(nums[1]) * unit : lo;
  return [lo, hi];
}

function formatTime(hhmm) {
  var s = String(hhmm).padStart(4, '0');
  return s.slice(0,2) + ':' + s.slice(2);
}

function formatDays(days) {
  if (!days || days === '' || days === '1234567') return 'Daily';
  if (days === '12345') return 'Mon–Fri';
  if (days === '67') return 'Sat–Sun';
  var names = ['','Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
  return days.split('').map(function(d){ return names[parseInt(d)] || d; }).join(',');
}

function buildWKF(bandId, subFreq) {
  var list = WKF[bandId];
  if (!list || !list.length) return '';
  var sub = parseFreqMHz(subFreq);
  if (!sub) return '';
  var span = sub[1] - sub[0] || sub[0] * 0.01;
  var lo = sub[0] - span * 0.05;
  var hi = sub[1] + span * 0.05;
  var filtered = list.filter(function(e) {
    var r = parseFreqMHz(e.freq);
    if (!r) return false;
    return r[1] >= lo && r[0] <= hi;
  });
  if (!filtered.length) return '';
  var regions = [
    { key:'UK',  cls:'wkf-uk',  label:'United Kingdom' },
    { key:'USA', cls:'wkf-usa', label:'United States' },
    { key:'RU',  cls:'wkf-ru',  label:'Russia' },
    { key:'DE',  cls:'wkf-de',  label:'Germany' },
    { key:'FR',  cls:'wkf-fr',  label:'France' },
    { key:'JP',  cls:'wkf-jp',  label:'Japan' },
    { key:'AU',  cls:'wkf-au',  label:'Australia' },
    { key:'CA',  cls:'wkf-ca',  label:'Canada' },
    { key:'IN',  cls:'wkf-in',  label:'India' },
    { key:'NL',  cls:'wkf-nl',  label:'Netherlands' },
  ];
  var html = '<div class="wkf-section"><h3>Well-Known Frequencies</h3>';
  regions.forEach(function(r) {
    var items = filtered.filter(function(e){ return e.region === r.key; });
    if (!items.length) return;
    html += '<div class="wkf-region"><h4 class="' + r.cls + '">' + r.label + '</h4>' +
      '<table class="wkf-table"><tr><th>Freq</th><th>Call / ID</th><th>Mode</th><th>Description</th></tr>';
    items.forEach(function(e) {
      html += '<tr><td class="wkf-freq">' + e.freq + '</td><td>' + e.call +
        '</td><td class="wkf-mod">' + e.mode + '</td><td>' + e.desc + '</td></tr>';
    });
    html += '</table></div>';
  });
  html += '</div>';
  return html;
}

function runBroadcast() {
  var cityInput = (($('#bcCity') && $('#bcCity').value) || '').trim();
  var freqInput = (($('#bcFreq') && $('#bcFreq').value) || '').trim();
  var timeInput = (($('#bcTime') && $('#bcTime').value) || '').trim();
  var results   = document.getElementById('bcResults');
  if (!results) return;

  if (!cityInput) {
    results.innerHTML = '<div class="bc-empty">Enter a city name to search.</div>';
    return;
  }

  /* ── find city in CITY_MAP ── */
  var cityName = cityInput.replace(/\s*\(.*\)$/, '').trim().toLowerCase();
  var city = CITY_MAP.find(function(c){ return c.name.toLowerCase() === cityName; });
  if (!city) city = CITY_MAP.find(function(c){ return c.name.toLowerCase().startsWith(cityName); });
  if (!city) {
    results.innerHTML = '<div class="bc-empty">City "<strong>' + cityInput + '</strong>" not found. Try a capital city or major city name.</div>';
    return;
  }

  /* ── parse time ── */
  var timeNum;
  if (timeInput) {
    var clean = timeInput.replace(':', '').replace(/\s/g,'').padStart(4,'0');
    timeNum = parseInt(clean, 10);
    if (isNaN(timeNum)) timeNum = null;
  }
  if (timeNum == null) {
    var now = new Date();
    timeNum = now.getUTCHours() * 100 + now.getUTCMinutes();
  }

  /* ── EiBi day (1=Mon…7=Sun) ── */
  var jsDay = new Date().getUTCDay();
  var eibiDay = jsDay === 0 ? 7 : jsDay;

  /* ── parse freq filter ── */
  var freqFilterKhz = freqInput ? _parseFreqToKhz(freqInput) : null;

  /* ── filter EIBI ── */
  var targets = city.targets;
  var filtered = EIBI.filter(function(e) {
    /* e = [freq_khz, start_hhmm, end_hhmm, days, itu, station, lang, target] */
    if (!targets.some(function(t){ return e[7] === t; })) return false;
    var start = e[1], end = e[2];
    var active = start <= end ? (timeNum >= start && timeNum < end) : (timeNum >= start || timeNum < end);
    if (!active) return false;
    var days = e[3];
    if (days && days !== '' && days !== '1234567') {
      if (days.indexOf(String(eibiDay)) < 0) return false;
    }
    if (freqFilterKhz !== null) {
      if (Math.abs(e[0] - freqFilterKhz) > 1) return false;
    }
    return true;
  });

  filtered.sort(function(a,b){ return a[0]-b[0]; });
  var limited = filtered.slice(0, 200);
  var more    = filtered.length > 200;

  if (!limited.length) {
    results.innerHTML = '<div class="bc-empty">No broadcasts found for <strong>' + city.name + '</strong> at ' + fmtTimeNum(timeNum) + ' UTC. Try a different time.</div>';
    return;
  }

  var html = '<div class="bc-meta">Showing ' + limited.length + (more ? ' of ' + filtered.length : '') +
    ' broadcasts for <strong>' + city.name + '</strong> at ' + fmtTimeNum(timeNum) + ' UTC</div>';
  html += '<table class="bc-table"><tr><th>Freq</th><th>Station</th><th>Lang</th><th>Time (UTC)</th><th>Days</th><th>ITU</th></tr>';
  limited.forEach(function(e) {
    html += '<tr><td class="bc-freq">' + fmtFreqKhz(e[0]) + '</td><td>' + e[5] +
      '</td><td>' + e[6] + '</td><td>' + formatTime(e[1]) + '–' + formatTime(e[2]) +
      '</td><td>' + formatDays(e[3]) + '</td><td>' + e[4] + '</td></tr>';
  });
  html += '</table>';
  if (more) html += '<div class="bc-meta" style="margin-top:8px">+ ' + (filtered.length - 200) + ' more — add a frequency to narrow results</div>';
  results.innerHTML = html;
}

function fmtFreqKhz(khz) {
  if (khz >= 1000) {
    var s = (khz / 1000).toFixed(3);
    return s.replace(/\.?0+$/, '') + ' MHz';
  }
  return Math.round(khz) + ' kHz';
}

function fmtTimeNum(t) {
  return String(Math.floor(t/100)).padStart(2,'0') + ':' + String(t%100).padStart(2,'0');
}

function _parseFreqToKhz(s) {
  var num = parseFloat(s.replace(/[^\d.]/g, ''));
  if (isNaN(num)) return null;
  if (/GHz/i.test(s)) return num * 1e6;
  if (/MHz/i.test(s)) return num * 1000;
  if (/kHz/i.test(s)) return num;
  return num < 30 ? num * 1000 : num;
}

      '<div class="calc-row"><label class="calc-label">Frequency</label>' +
        '<input id="calc_dop_freq" class="calc-input" placeholder="e.g. 145.500 MHz" oninput="calc_doppler()"/></div>' +
      '<div class="calc-row"><label class="calc-label">Velocity</label>' +
        '<input id="calc_dop_vel" class="calc-input" placeholder="e.g. 7800 m/s or 250 km/h" oninput="calc_doppler()"/></div>' +
      '<div id="calc_dop_res" class="calc-result"></div>' +
       '<div class="calc-note">Δf = f₀ × v/c &nbsp;(positive = approaching)</div>' +
       '</div></div>';
}

    [1,.75,.5,.25].forEach(function(f){
      svg += '<circle cx="'+cx+'" cy="'+cy+'" r="'+(r*f)+'" fill="none" stroke="#1e2840" stroke-width="1"/>';
    });

    svg += '<line x1="'+cx+'" y1="'+(cy-r-8)+'" x2="'+cx+'" y2="'+(cy+r+8)+'" stroke="#1e2840" stroke-width="1"/>';
    svg += '<line x1="'+(cx-r-8)+'" y1="'+cy+'" x2="'+(cx+r+8)+'" y2="'+cy+'" stroke="#1e2840" stroke-width="1"/>';

    svg += '<text x="'+cx+'" y="'+(cy-r-10)+'" text-anchor="middle" fill="#3a4a60" font-size="9" font-family="JetBrains Mono,monospace">N</text>';
    svg += '<text x="'+cx+'" y="'+(cy+r+18)+'" text-anchor="middle" fill="#3a4a60" font-size="9" font-family="JetBrains Mono,monospace">S</text>';

    var pts = [];
    for (var deg = 0; deg < 360; deg += 2) {
      var rad = deg * Math.PI / 180;
      var g = Math.max(0, Math.min(1, patFn(deg)));
      pts.push((cx + r * g * Math.sin(rad)).toFixed(1) + ',' + (cy - r * g * Math.cos(rad)).toFixed(1));

function _parseFreqMHz_calc(s) {
  var num = parseFloat((s || '').replace(/[^0-9.]/g, ''));
  if (isNaN(num)) return NaN;
  if (/GHz/i.test(s)) return num * 1000;
  if (/MHz/i.test(s)) return num;
  if (/kHz/i.test(s)) return num / 1000;
  if (/Hz/i.test(s))  return num / 1e6;
  if (num < 30)       return num;           /* assume MHz */
  if (num < 30000)    return num / 1000;    /* assume kHz */
  return num / 1e6;                         /* assume Hz */
}

function calc_wl() {
  var f = _parseFreqMHz_calc(($('#calc_wl_freq')||{}).value);
  if (isNaN(f)||f<=0){ var r=$('#calc_wl_res'); if(r) r.innerHTML=''; return; }
  var wl = 299.792 / f;
  var disp = wl >= 1 ? wl.toFixed(3)+' m' : (wl*100).toFixed(2)+' cm';
  $('#calc_wl_res').innerHTML = '<span class="calc-ans">λ = <strong>'+disp+'</strong></span>';
}

function calc_wl_rev() {
  var s = (($('#calc_wl_wl')||{}).value||'').trim();
  var num = parseFloat(s);
  if (isNaN(num)||num<=0){ var r=$('#calc_wl_res'); if(r) r.innerHTML=''; return; }
  var wlM = /km/i.test(s)?num*1000:/cm/i.test(s)?num/100:/mm/i.test(s)?num/1000:num;
  var f = 299.792/wlM;
  var disp = f>=1000?(f/1000).toFixed(4)+' GHz':f>=1?f.toFixed(4)+' MHz':(f*1000).toFixed(3)+' kHz';
  $('#calc_wl_res').innerHTML = '<span class="calc-ans">f = <strong>'+disp+'</strong></span>';
}

function calc_ant() {
  var f = _parseFreqMHz_calc(($('#calc_ant_freq')||{}).value);
  if (isNaN(f)||f<=0){ var r=$('#calc_ant_res'); if(r) r.innerHTML=''; return; }
  var half = (0.475*299.792)/f;
  $('#calc_ant_res').innerHTML = '<span class="calc-ans">Half-dipole: <strong>'+half.toFixed(3)+' m</strong> &nbsp; Quarter-wave: <strong>'+(half/2).toFixed(3)+' m</strong></span>';
}

function calc_fspl() {
  var f  = _parseFreqMHz_calc(($('#calc_fspl_freq')||{}).value);
  var ds = (($('#calc_fspl_dist')||{}).value||'').trim();
  var dn = parseFloat(ds);
  if (isNaN(f)||f<=0||isNaN(dn)||dn<=0){ var r=$('#calc_fspl_res'); if(r) r.innerHTML=''; return; }
  /* distance in km */
  var dkm = /km/i.test(ds) ? dn : /\bm\b/i.test(ds) ? dn/1000 : dn; /* default km */
  var fspl = 20*Math.log10(dkm) + 20*Math.log10(f) + 32.45;
  $('#calc_fspl_res').innerHTML = '<span class="calc-ans">FSPL = <strong>'+fspl.toFixed(1)+' dB</strong></span>';
}

function calc_pwr_fromdbm() {
  var v = parseFloat(($('#calc_pwr_dbm')||{}).value);
  if (isNaN(v)){ var r=$('#calc_pwr_res'); if(r) r.innerHTML=''; return; }
  var w = Math.pow(10,(v-30)/10);
  $('#calc_pwr_res').innerHTML = '<span class="calc-ans"><strong>'+v+' dBm</strong> = '+_fmtPow(w)+'</span>';
}

function calc_pwr_fromw() {
  var v = parseFloat(($('#calc_pwr_w')||{}).value);
  if (isNaN(v)||v<=0){ var r=$('#calc_pwr_res'); if(r) r.innerHTML=''; return; }
  var dbm = 10*Math.log10(v*1000);
  $('#calc_pwr_res').innerHTML = '<span class="calc-ans"><strong>'+_fmtPow(v)+'</strong> = '+dbm.toFixed(2)+' dBm</span>';
}

function _fmtPow(w){
  if(w>=1)   return w.toPrecision(4)+' W';
  if(w>=1e-3) return (w*1e3).toPrecision(4)+' mW';
  if(w>=1e-6) return (w*1e6).toPrecision(4)+' μW';
  return (w*1e9).toPrecision(4)+' nW';
}

function calc_doppler() {
  var f  = _parseFreqMHz_calc(($('#calc_dop_freq')||{}).value);
  var vs = (($('#calc_dop_vel')||{}).value||'').trim();
  var vn = parseFloat(vs);
  if (isNaN(f)||f<=0||isNaN(vn)){ var r=$('#calc_dop_res'); if(r) r.innerHTML=''; return; }
  var vms = /km\/h/i.test(vs)?vn/3.6:/km\/s/i.test(vs)?vn*1000:vn; /* m/s */
  var df  = (f*1e6)*vms/299792458;
  var disp = Math.abs(df)<1000?df.toFixed(2)+' Hz':(df/1000).toFixed(3)+' kHz';
  $('#calc_dop_res').innerHTML = '<span class="calc-ans">Δf = <strong>'+disp+'</strong></span>';
}

function openSearch(query) {
  activeView = 'search';
  lastSearchQuery = query || '';
  activeBand = null;
  activeSub = null;
  document.querySelectorAll('.band-btn').forEach(el => el.classList.toggle('active', el.dataset.band === 'search'));
  $('#subPanel').classList.remove('open');
  const d = $('#detailInner');
  d.style.display = 'block';
  $('#emptyState').style.display = 'none';
  $('#detailPanel').classList.add('open');

  var q = (query || '').trim().toLowerCase();

  var html = '<div class="accent-bar" style="background:' + tc('#88ff66') + '"></div>' +
    '<div class="detail-title" style="color:' + tc('#88ff66') + '">Search</div>';

  if (!q) {
    html += '<div class="search-empty">Type a term, frequency, or mode in the search box above (<span class="key">/</span> to focus).</div>';
    d.innerHTML = html;
    return;
  }

  html += '<div class="search-query">Results for: <strong>' + q.replace(/</g,'&lt;') + '</strong></div>';

  /* band / sub-band matches */
  var bandResults = [];
  BANDS.forEach(function(band) {
    if (band.name.toLowerCase().includes(q) || band.full.toLowerCase().includes(q) || band.range.toLowerCase().includes(q)) {
      bandResults.push({ band:band, sub:null });
    }
    band.subs.forEach(function(sub) {
      if (sub.name.toLowerCase().includes(q) || sub.freq.toLowerCase().includes(q) ||
          sub.usage.toLowerCase().includes(q) || (sub.desc&&sub.desc.toLowerCase().includes(q)) ||
          sub.mod.toLowerCase().includes(q)) {
        bandResults.push({ band:band, sub:sub });
      }
    });
  });

  /* glossary matches */
  var glossResults = GLOSSARY.filter(function(item) {
    if (!item.term) return false;
    return item.term.toLowerCase().includes(q) || item.def.toLowerCase().includes(q);
  });

  /* WKF matches */
  var wkfResults = [];
  Object.keys(WKF).forEach(function(bandId) {
    WKF[bandId].forEach(function(entry) {
      if (entry.freq.toLowerCase().includes(q) || entry.call.toLowerCase().includes(q) ||
          entry.desc.toLowerCase().includes(q) || entry.mode.toLowerCase().includes(q)) {
        wkfResults.push({ bandId:bandId, entry:entry });
      }
    });
  });

  var total = bandResults.length + glossResults.length + wkfResults.length;
  if (!total) {
    html += '<div class="search-empty">No results found for "<strong>' + q.replace(/</g,'&lt;') + '</strong>".</div>';
    d.innerHTML = html;
    return;
  }

  html += '<div class="search-count">' + total + ' result' + (total!==1?'s':'') + '</div>';

  if (glossResults.length) {
    html += '<div class="search-section"><h4 class="search-section-title" style="color:'+tc('#88ccff')+'">Glossary ('+glossResults.length+')</h4>';
    glossResults.slice(0,20).forEach(function(item) {
      html += '<div class="search-item" onclick="openGlossary()">' +
        '<div class="search-item-title">'+item.term+'</div>' +
        '<div class="search-item-sub">'+item.def+'</div>' +
        '</div>';
    });
    html += '</div>';
  }

  if (bandResults.length) {
    html += '<div class="search-section"><h4 class="search-section-title" style="color:'+tc('#88ff66')+'">Bands &amp; Sub-bands ('+bandResults.length+')</h4>';
    bandResults.slice(0,30).forEach(function(r) {
      if (r.sub) {
        var esc = r.sub.name.replace(/\\/g,'\\\\').replace(/'/g,"\\'");
        html += '<div class="search-item" onclick="navigateToBandSub(\''+r.band.id+'\',\''+esc+'\')">' +
          '<div class="search-item-title">'+r.sub.name+'</div>' +
          '<div class="search-item-sub">'+r.band.full+' · '+r.sub.freq+'</div>' +
          '</div>';
      } else {
        html += '<div class="search-item" onclick="navigateToBandSub(\''+r.band.id+'\',null)">' +
          '<div class="search-item-title">'+r.band.full+'</div>' +
          '<div class="search-item-sub">'+r.band.range+'</div>' +
          '</div>';
      }
    });
    html += '</div>';
  }

  if (wkfResults.length) {
    html += '<div class="search-section"><h4 class="search-section-title" style="color:'+tc('#ffaa44')+'">Well-Known Frequencies ('+wkfResults.length+')</h4>';
    wkfResults.slice(0,30).forEach(function(r) {
      html += '<div class="search-item">' +
        '<div class="search-item-title">'+r.entry.freq+' — '+r.entry.call+' ['+r.entry.region+']</div>' +
        '<div class="search-item-sub">'+r.entry.desc+'</div>' +
        '</div>';
    });
    html += '</div>';
  }

  d.innerHTML = html;
}

function navigateToBandSub(bandId, subName) {
  var band = BANDS.find(function(b){ return b.id === bandId; });
  if (!band) return;
  selectBand(band);
  if (subName) {
    var sub = band.subs.find(function(s){ return s.name === subName; });
    if (sub) {
      setTimeout(function() {
        var btns = document.querySelectorAll('#subInner .sub-btn');
        var idx  = band.subs.indexOf(sub);
        if (btns[idx]) selectSub(band, sub, btns[idx]);
      }, 0);
    }
  }
}

    { name:'Troposphere',  bot:0,   top:12,  color:lt?'#4a9a7a':'#2a5a4a', note:'Weather, tropo ducting (VHF/UHF)', tag:'0–12 km' },
    { name:'Stratosphere', bot:12,  top:50,  color:lt?'#4a7a9a':'#2a4a6a', note:'Stable; no significant radio effect', tag:'12–50 km' },
    { name:'D-Layer',      bot:60,  top:90,  color:lt?'#b05050':'#6a3030', note:'Absorbs HF by day; vanishes at night', tag:'60–90 km' },
    { name:'E-Layer',      bot:90,  top:150, color:lt?'#a0a030':'#6a6a30', note:'Sporadic E reflects VHF; MF reflection', tag:'90–150 km' },
    { name:'F1-Layer',     bot:150, top:250, color:lt?'#50a050':'#306a30', note:'Merges with F2 at night', tag:'150–250 km' },
    { name:'F2-Layer',     bot:250, top:500, color:lt?'#5050a0':'#30306a', note:'Primary HF refraction layer; DX engine', tag:'250–500 km' },
  ];

  /* piecewise altitude scale (3-segment): 0–50 km 30%, 50–100 km 12%, 100–520 km 58% */
  const padTop = 28, padBot = 60, axisL = 58, axisR = w - 16;
  const usable = h - padTop - padBot;
  const seg1 = 0.30 * usable;   /* 0–50 km   — generous for Troposphere */
  const seg2 = 0.12 * usable;   /* 50–100 km  */
  const seg3 = 0.58 * usable;   /* 100–520 km */
  const alt2y = a => {
    if (a <= 50)  return h - padBot - (a / 50) * seg1;
    if (a <= 100) return h - padBot - seg1 - ((a - 50) / 50) * seg2;
    return h - padBot - seg1 - seg2 - ((a - 100) / 420) * seg3;
  };

  /* palette */
  const bg       = lt ? '#f0f2f6' : '#0a0c14';
  const gridClr  = lt ? '#d0d5e0' : '#161c28';
  const gridMaj  = lt ? '#c0c8d4' : '#1a2030';
  const axisTxt  = lt ? '#5a6878' : '#8a9ab0';
  const labelTxt = lt ? '#2a3040' : '#d0dce8';
  const noteTxt  = lt ? '#4a5a6e' : '#8a9ab4';
  const earthFg  = lt ? '#2a7a50' : '#8abba0';
  const earthBg  = lt ? '#b8e0b8' : '#1a3020';
  const skyClr   = lt ? '#5588cc' : '#6699ff';
  const gwClr    = lt ? '#aa8800' : '#ffc833';
  const losClr   = lt ? '#00884a' : '#33ff88';
  const arrowOp  = lt ? '0.85' : '0.9';

  let svg = '<div class="prop-section"><h3>Atmospheric Layers & Ionosphere</h3>' +
    '<div class="world-map-wrap"><svg viewBox="0 0 ' + w + ' ' + h + '">';

  /* ── background ── */
  svg += '<rect width="' + w + '" height="' + h + '" fill="' + bg + '" rx="4"/>';

  /* ── defs: gradients for each layer + arrowhead markers ── */
  svg += '<defs>';
  layers.forEach(function(l, i) {
    svg += '<linearGradient id="lg' + i + '" x1="0" y1="0" x2="1" y2="0">' +
      '<stop offset="0%" stop-color="' + l.color + '" stop-opacity="' + (lt?'0.38':'0.45') + '"/>' +
      '<stop offset="100%" stop-color="' + l.color + '" stop-opacity="' + (lt?'0.12':'0.18') + '"/>' +
      '</linearGradient>';
  });
  /* arrow markers */
  svg += '<marker id="arrSky" viewBox="0 0 10 8" refX="10" refY="4" markerWidth="8" markerHeight="6" orient="auto">' +
    '<path d="M0,0 L10,4 L0,8 Z" fill="' + skyClr + '"/></marker>';
  svg += '<marker id="arrGw" viewBox="0 0 10 8" refX="10" refY="4" markerWidth="8" markerHeight="6" orient="auto">' +
    '<path d="M0,0 L10,4 L0,8 Z" fill="' + gwClr + '"/></marker>';
  svg += '<marker id="arrLos" viewBox="0 0 10 8" refX="10" refY="4" markerWidth="8" markerHeight="6" orient="auto">' +
    '<path d="M0,0 L10,4 L0,8 Z" fill="' + losClr + '"/></marker>';
  svg += '</defs>';

  /* ── altitude grid lines ── */
  [0, 50, 100, 200, 300, 400, 500].forEach(function(alt) {
    var y = alt2y(alt);
    var major = alt % 100 === 0;
    svg += '<line x1="' + axisL + '" y1="' + y + '" x2="' + axisR + '" y2="' + y + '" stroke="' + (major ? gridMaj : gridClr) + '" stroke-width="' + (major ? '0.6' : '0.3') + '" stroke-dasharray="' + (major ? '0' : '3,4') + '"/>';
    svg += '<text x="' + (axisL - 6) + '" y="' + (y + 3.5) + '" fill="' + axisTxt + '" font-size="9" text-anchor="end">' + alt + ' km</text>';
  });

  /* ── mesopause gap label (50–60 km) ── */
  var gapY = (alt2y(50) + alt2y(60)) / 2;
  svg += '<text x="' + ((axisL + axisR) / 2) + '" y="' + (gapY + 3) + '" fill="' + (lt ? '#a0a8b8' : '#3a4550') + '" font-size="8" text-anchor="middle" letter-spacing="3" text-transform="uppercase">— mesosphere gap —</text>';

  /* ── draw layers ── */
  layers.forEach(function(l, i) {
    var y1 = alt2y(l.top);
    var y2 = alt2y(l.bot);
    var lh = y2 - y1;

    /* filled band with gradient */
    svg += '<rect x="' + axisL + '" y="' + y1 + '" width="' + (axisR - axisL) + '" height="' + lh + '" fill="url(#lg' + i + ')" rx="2"/>';
    /* subtle top/bottom border lines */
    svg += '<line x1="' + axisL + '" y1="' + y1 + '" x2="' + axisR + '" y2="' + y1 + '" stroke="' + l.color + '" stroke-width="0.6" opacity="' + (lt ? '0.5' : '0.4') + '"/>';
    svg += '<line x1="' + axisL + '" y1="' + (y1 + lh) + '" x2="' + axisR + '" y2="' + (y1 + lh) + '" stroke="' + l.color + '" stroke-width="0.3" opacity="' + (lt ? '0.3' : '0.2') + '"/>';

    /* left: layer name + altitude tag */
    var mid = y1 + lh / 2;
    svg += '<text x="' + (axisL + 10) + '" y="' + (mid + 1) + '" fill="' + labelTxt + '" font-size="12" font-weight="600">' + l.name + '</text>';
    svg += '<text x="' + (axisL + 10) + '" y="' + (mid + 13) + '" fill="' + noteTxt + '" font-size="8.5">' + l.tag + '</text>';

    /* right: description */
    svg += '<text x="' + (axisR - 8) + '" y="' + (mid + 4) + '" fill="' + noteTxt + '" font-size="10" text-anchor="end">' + l.note + '</text>';
  });

  /* ── Earth surface ── */
  var groundY = alt2y(0);
  svg += '<rect x="' + axisL + '" y="' + groundY + '" width="' + (axisR - axisL) + '" height="8" fill="' + earthBg + '" rx="1"/>';
  svg += '<line x1="' + axisL + '" y1="' + groundY + '" x2="' + axisR + '" y2="' + groundY + '" stroke="' + earthFg + '" stroke-width="1.2"/>';
  svg += '<text x="' + (axisL + 10) + '" y="' + (groundY + 22) + '" fill="' + earthFg + '" font-size="10" font-weight="600">EARTH SURFACE</text>';

  /* ── Propagation paths ── */

  /* transmitter tower icon */
  var txX = axisL + 140;
  var txBase = groundY;
  var txTop = txBase - 38;
  svg += '<line x1="' + txX + '" y1="' + txBase + '" x2="' + txX + '" y2="' + txTop + '" stroke="' + labelTxt + '" stroke-width="2"/>';
  svg += '<line x1="' + (txX - 6) + '" y1="' + txBase + '" x2="' + txX + '" y2="' + txTop + '" stroke="' + labelTxt + '" stroke-width="0.8" opacity="0.5"/>';
  svg += '<line x1="' + (txX + 6) + '" y1="' + txBase + '" x2="' + txX + '" y2="' + txTop + '" stroke="' + labelTxt + '" stroke-width="0.8" opacity="0.5"/>';
  svg += '<circle cx="' + txX + '" cy="' + (txTop - 4) + '" r="2.5" fill="' + skyClr + '"/>';

  /* radio wave arcs emanating from tower top */
  [12, 20, 28].forEach(function(r) {
    svg += '<path d="M' + (txX + r * 0.7) + ',' + (txTop - 4 - r * 0.7) + ' A' + r + ',' + r + ' 0 0,0 ' + (txX + r * 0.7) + ',' + (txTop - 4 + r * 0.7) + '" fill="none" stroke="' + skyClr + '" stroke-width="0.6" opacity="0.35"/>';
  });

  /* ── Sky wave: smooth Bézier arc from TX up to F2 and back down ── */
  var f2mid = (alt2y(500) + alt2y(250)) / 2;
  var skyLandX = axisL + 520;
  var skyCpX1 = txX + 60, skyCpY1 = f2mid - 30;
  var skyCpX2 = skyLandX - 60, skyCpY2 = f2mid - 30;
  svg += '<path d="M' + txX + ',' + (txTop - 4) + ' C' + skyCpX1 + ',' + skyCpY1 + ' ' + skyCpX2 + ',' + skyCpY2 + ' ' + skyLandX + ',' + (groundY - 2) + '" fill="none" stroke="' + skyClr + '" stroke-width="2" opacity="' + arrowOp + '" marker-end="url(#arrSky)"/>';
  /* label at the apex */
  var skyApexX = (txX + skyLandX) / 2;
  svg += '<text x="' + (skyApexX + 4) + '" y="' + (f2mid - 12) + '" fill="' + skyClr + '" font-size="10" font-weight="600" text-anchor="middle">SKY WAVE (HF)</text>';
  svg += '<text x="' + (skyApexX + 4) + '" y="' + (f2mid + 1) + '" fill="' + skyClr + '" font-size="8" text-anchor="middle" opacity="0.7">Refracted by F2-Layer</text>';

  /* ── Ground wave: smooth arc hugging earth ── */
  var gwEndX = axisL + 340;
  svg += '<path d="M' + txX + ',' + (txTop + 8) + ' Q' + ((txX + gwEndX) / 2) + ',' + (groundY - 40) + ' ' + gwEndX + ',' + (groundY - 2) + '" fill="none" stroke="' + gwClr + '" stroke-width="1.8" stroke-dasharray="6,3" opacity="' + arrowOp + '" marker-end="url(#arrGw)"/>';
  svg += '<text x="' + ((txX + gwEndX) / 2 - 10) + '" y="' + (groundY - 40) + '" fill="' + gwClr + '" font-size="10" font-weight="600">GROUND WAVE (LF/MF)</text>';
  svg += '<text x="' + ((txX + gwEndX) / 2 - 10) + '" y="' + (groundY - 29) + '" fill="' + gwClr + '" font-size="8" opacity="0.7">Follows Earth curvature</text>';

  /* ── Line of sight: straight low-angle line ── */
  var losEndX = axisL + 260;
  svg += '<line x1="' + txX + '" y1="' + (txTop - 4) + '" x2="' + losEndX + '" y2="' + (groundY - 8) + '" stroke="' + losClr + '" stroke-width="1.8" opacity="' + arrowOp + '" marker-end="url(#arrLos)"/>';
  svg += '<text x="' + ((txX + losEndX) / 2 + 14) + '" y="' + (txTop - 14) + '" fill="' + losClr + '" font-size="10" font-weight="600">LINE OF SIGHT (VHF/UHF/SHF)</text>';

  /* ── NVIS: near-vertical arc up and straight back down ── */
  var nvisClr = lt ? '#9955cc' : '#bb88ff';
  var nvisApexY = alt2y(280);
  var nvisReturnX = txX + 55;
  svg += '<path d="M' + txX + ',' + (txTop - 4) + ' C' + (txX + 5) + ',' + (nvisApexY - 10) + ' ' + (nvisReturnX + 5) + ',' + (nvisApexY - 10) + ' ' + nvisReturnX + ',' + (groundY - 2) + '" fill="none" stroke="' + nvisClr + '" stroke-width="1.5" stroke-dasharray="4,3" opacity="0.75" marker-end="url(#arrSky)"/>';
  svg += '<text x="' + (txX + 30) + '" y="' + (nvisApexY + 14) + '" fill="' + nvisClr + '" font-size="9" font-weight="500">NVIS</text>';

  /* ── "Altitude" axis label ── */
  svg += '<text x="12" y="' + (h / 2) + '" fill="' + axisTxt + '" font-size="9" text-anchor="middle" transform="rotate(-90,12,' + (h / 2) + ')" letter-spacing="2">ALTITUDE</text>';

  /* ── top caption ── */
  svg += '<text x="' + (w / 2) + '" y="16" fill="' + (lt ? '#5a6878' : '#6a7a90') + '" font-size="9" text-anchor="middle">Ionospheric layers and radio propagation paths — not to scale</text>';

  /* border */
  svg += '<rect width="' + w + '" height="' + h + '" fill="none" stroke="' + (lt ? '#c0c8d4' : '#1a2030') + '" stroke-width="0.5" rx="4"/>';

  svg += '</svg></div>';

  /* ── legend (matching world-map style) ── */
  svg += '<div class="prop-legend">' +
    '<div class="prop-legend-item"><div class="prop-legend-swatch" style="background:' + skyClr + '"></div>Sky Wave (HF)</div>' +
    '<div class="prop-legend-item"><div class="prop-legend-swatch" style="background:' + gwClr + '"></div>Ground Wave (LF/MF)</div>' +
    '<div class="prop-legend-item"><div class="prop-legend-swatch" style="background:' + losClr + '"></div>Line of Sight (VHF+)</div>' +
    '<div class="prop-legend-item"><div class="prop-legend-swatch" style="background:' + nvisClr + '"></div>NVIS (2–10 MHz)</div>' +
    '</div></div>';
  return svg;
}

/* ── Propagation modes description ────────────────────────── */
function buildPropModes() {
  return '<div class="prop-section"><h3>Propagation Modes</h3>' +
    '<table class="detail-table">' +
    row('Ground Wave', 'Signal follows Earth\'s curvature. Dominant below ~2 MHz. Range: 100–3 000 km depending on frequency, power, and ground conductivity. Reliable day and night.') +
    row('Sky Wave', 'Signal refracted by ionosphere (F-layer) back to Earth. Primary mode for HF (3–30 MHz). Enables intercontinental communication. Strongly affected by time of day, season, and solar cycle.') +
    row('NVIS', 'Near Vertical Incidence Skywave. Signal sent nearly straight up and reflected down. Covers 0–600 km radius with no skip zone. Best on 2–10 MHz. Used for regional emergency comms.') +
    row('Line of Sight', 'Direct path; dominant above 30 MHz (VHF and up). Range limited by antenna height and Earth\'s curvature. At 2 m height: ~5 km. At 30 m tower: ~25 km. At FL350 aircraft: ~370 km.') +
    row('Tropo Ducting', 'Temperature inversion creates atmospheric duct trapping VHF/UHF signals. Extends range to 500+ km over water. Common in coastal and desert regions.') +
    row('Sporadic E', 'Unpredictable dense ionisation patches at ~100 km altitude. Reflects signals up to ~150 MHz. Duration: minutes to hours. Enables surprise VHF DX to ~2 000 km.') +
    row('Meteor Scatter', 'Signals reflected off ionised meteor trails at ~80–120 km altitude. Brief bursts (0.5–10 s). Used at 30–100 MHz. Random but predictable rates during annual meteor showers.') +
    row('EME (Moonbounce)', 'Signals bounced off the Moon\'s surface. Round-trip delay ~2.4 s. Path loss ~250 dB. Requires high power and large antennas. Works at VHF through microwave frequencies.') +
    row('Skip / Skip Zone', 'The "dead zone" between the outer limit of ground-wave reception and where the first sky wave returns to Earth. Within the skip zone, no signal is received. Skip distance depends on frequency, ionisation level and transmission angle. At HF (3–30 MHz), skip zones typically range from 100 km to 4 000+ km — higher frequencies produce longer skip. Below ~3 MHz, ground wave fills the gap so skip zones rarely form. Above ~30 MHz, ionospheric refraction is normally absent so there is no skip — signals travel line-of-sight only (except during sporadic-E or TEP events on lower VHF).') +
    '</table>' +
    buildSkipDiagram() +
    '</div>';
}

/* ── Skip Zone diagram (SVG) ─────────────────────────────── */
function buildSkipDiagram() {
  const lt = isLight();
  const w = 900, h = 340;

  /* palette */
  const bg        = lt ? '#f0f2f6' : '#0a0c14';
  const ground    = lt ? '#a8d4a8' : '#1a3020';
  const groundTx  = lt ? '#2a7a50' : '#8abba0';
  const ionoFill  = lt ? '#c8d8f0' : '#1a2040';
  const ionoLine  = lt ? '#8899bb' : '#334466';
  const ionoTxt   = lt ? '#5566aa' : '#7788cc';
  const skyClr    = lt ? '#669900' : '#aaff33';
  const gwClr     = lt ? '#aa8800' : '#ffc833';
  const skipFill  = lt ? 'rgba(204,34,34,0.12)' : 'rgba(255,68,68,0.10)';
  const skipStroke = lt ? '#cc2222' : '#ff4444';
  const dimTxt    = lt ? '#5a6878' : '#6a7a90';
  const labelTxt  = lt ? '#3a4558' : '#c0ccd8';
  const arrowClr  = lt ? '#cc6600' : '#ff8833';

  /* key Y positions */
  const earthY   = 260;   /* top of earth band */
  const earthH   = 20;
  const ionoTopY = 30;
  const ionoBotY = 80;

  /* X positions */
  const towerX   = 100;   /* transmitter tower base */
  const towerH   = 60;    /* tower height in px */
  const towerTop = earthY - towerH;

  const gwEndX   = 320;   /* where ground wave fades */
  const skipEndX = 680;   /* where sky wave lands */
  const rxX      = skipEndX;

  let s = '<svg class="atmo-diagram" viewBox="0 0 ' + w + ' ' + h + '">';

  /* background */
  s += '<rect x="0" y="0" width="' + w + '" height="' + h + '" fill="' + bg + '" rx="4"/>';

  /* ionosphere band (curved) */
  s += '<path d="M0,' + ionoBotY + ' Q' + (w/2) + ',' + (ionoBotY + 20) + ' ' + w + ',' + ionoBotY + ' L' + w + ',' + ionoTopY + ' Q' + (w/2) + ',' + (ionoTopY + 12) + ' 0,' + ionoTopY + ' Z" fill="' + ionoFill + '" stroke="' + ionoLine + '" stroke-width="0.5"/>';
  /* crosshatch fill for ionosphere */
  s += '<defs><pattern id="ionoHatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">' +
       '<line x1="0" y1="0" x2="0" y2="8" stroke="' + ionoLine + '" stroke-width="0.5" opacity="0.35"/>' +
       '</pattern></defs>';
  s += '<path d="M0,' + ionoBotY + ' Q' + (w/2) + ',' + (ionoBotY + 20) + ' ' + w + ',' + ionoBotY + ' L' + w + ',' + ionoTopY + ' Q' + (w/2) + ',' + (ionoTopY + 12) + ' 0,' + ionoTopY + ' Z" fill="url(#ionoHatch)"/>';
  s += '<text x="' + (w - 20) + '" y="' + ((ionoTopY + ionoBotY) / 2 + 4) + '" fill="' + ionoTxt + '" font-size="12" font-weight="600" text-anchor="end">IONOSPHERE</text>';

  /* earth surface — gentle upward curve to indicate Earth curvature */
  s += '<path d="M0,' + earthY + ' Q' + (w/2) + ',' + (earthY - 18) + ' ' + w + ',' + earthY + ' L' + w + ',' + h + ' L0,' + h + ' Z" fill="' + ground + '" opacity="0.5"/>';
  s += '<path d="M0,' + earthY + ' Q' + (w/2) + ',' + (earthY - 18) + ' ' + w + ',' + earthY + '" fill="none" stroke="' + groundTx + '" stroke-width="1.5"/>';

  /* transmitter tower */
  var tb = earthY;
  var tt = towerTop;
  s += '<line x1="' + towerX + '" y1="' + tb + '" x2="' + towerX + '" y2="' + tt + '" stroke="' + labelTxt + '" stroke-width="2.5"/>';
  /* tower crossbars */
  for (var ci = 1; ci <= 4; ci++) {
    var cy = tb - ci * (towerH / 5);
    var cw = 4 + ci * 1.5;
    s += '<line x1="' + (towerX - cw) + '" y1="' + cy + '" x2="' + (towerX + cw) + '" y2="' + cy + '" stroke="' + labelTxt + '" stroke-width="1"/>';
  }
  /* tower diagonals */
  s += '<line x1="' + (towerX - 8) + '" y1="' + tb + '" x2="' + towerX + '" y2="' + tt + '" stroke="' + labelTxt + '" stroke-width="1" opacity="0.6"/>';
  s += '<line x1="' + (towerX + 8) + '" y1="' + tb + '" x2="' + towerX + '" y2="' + tt + '" stroke="' + labelTxt + '" stroke-width="1" opacity="0.6"/>';
  /* antenna tip */
  s += '<line x1="' + towerX + '" y1="' + tt + '" x2="' + towerX + '" y2="' + (tt - 10) + '" stroke="' + skipStroke + '" stroke-width="1.5"/>';
  s += '<circle cx="' + towerX + '" cy="' + (tt - 12) + '" r="2" fill="' + skipStroke + '"/>';
  /* "TX" label */
  s += '<text x="' + towerX + '" y="' + (earthY + 18) + '" fill="' + labelTxt + '" font-size="11" font-weight="600" text-anchor="middle">TX</text>';

  /* ── Ground wave: hatched wedge from tower along earth ─── */
  var gwMidY = earthY - 20;
  /* wedge shape */
  s += '<path d="M' + towerX + ',' + (towerTop + 10) + ' Q' + ((towerX + gwEndX) / 2) + ',' + (gwMidY - 30) + ' ' + gwEndX + ',' + (earthY - 2) + ' L' + towerX + ',' + (earthY - 2) + ' Z" fill="' + gwClr + '" opacity="0.12"/>';
  /* hatching */
  s += '<defs><pattern id="gwHatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(0)">' +
       '<line x1="0" y1="0" x2="0" y2="6" stroke="' + gwClr + '" stroke-width="0.8" opacity="0.4"/>' +
       '</pattern></defs>';
  s += '<path d="M' + towerX + ',' + (towerTop + 10) + ' Q' + ((towerX + gwEndX) / 2) + ',' + (gwMidY - 30) + ' ' + gwEndX + ',' + (earthY - 2) + ' L' + towerX + ',' + (earthY - 2) + ' Z" fill="url(#gwHatch)"/>';
  /* upper edge */
  s += '<path d="M' + towerX + ',' + (towerTop + 10) + ' Q' + ((towerX + gwEndX) / 2) + ',' + (gwMidY - 30) + ' ' + gwEndX + ',' + (earthY - 2) + '" fill="none" stroke="' + gwClr + '" stroke-width="1.5"/>';
  /* label */
  s += '<text x="' + ((towerX + gwEndX) / 2 - 20) + '" y="' + (earthY - 48) + '" fill="' + gwClr + '" font-size="12" font-weight="600">GROUND WAVE</text>';

  /* ── Sky wave: line from tower up to ionosphere, then down ── */
  var skyBounceX = (towerX + skipEndX) / 2 + 30;
  var skyBounceY = ionoBotY + 10;
  s += '<path d="M' + towerX + ',' + (towerTop - 10) + ' L' + skyBounceX + ',' + skyBounceY + ' L' + skipEndX + ',' + (earthY - 2) + '" fill="none" stroke="' + skyClr + '" stroke-width="2.5"/>';
  /* label along upper leg */
  var skyLabelX = (towerX + skyBounceX) / 2 - 10;
  var skyLabelY = (towerTop - 10 + skyBounceY) / 2 - 6;
  s += '<text x="' + skyLabelX + '" y="' + skyLabelY + '" fill="' + skyClr + '" font-size="12" font-weight="600" transform="rotate(-42,' + skyLabelX + ',' + skyLabelY + ')">SKY WAVE</text>';

  /* ── Skip zone shaded area ── */
  var skipStartX = gwEndX;
  s += '<rect x="' + skipStartX + '" y="' + (earthY - 50) + '" width="' + (skipEndX - skipStartX) + '" height="50" fill="' + skipFill + '" rx="2"/>';
  /* diagonal hatching in skip zone */
  s += '<defs><pattern id="skipHatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">' +
       '<line x1="0" y1="0" x2="0" y2="10" stroke="' + skipStroke + '" stroke-width="0.6" opacity="0.25"/>' +
       '</pattern></defs>';
  s += '<rect x="' + skipStartX + '" y="' + (earthY - 50) + '" width="' + (skipEndX - skipStartX) + '" height="50" fill="url(#skipHatch)" rx="2"/>';
  /* skip zone label */
  var skipMidX = (skipStartX + skipEndX) / 2;
  s += '<text x="' + skipMidX + '" y="' + (earthY - 58) + '" fill="' + skipStroke + '" font-size="12" font-weight="700" text-anchor="middle">SKIP ZONE</text>';
  s += '<text x="' + skipMidX + '" y="' + (earthY - 24) + '" fill="' + skipStroke + '" font-size="10" text-anchor="middle" opacity="0.8">no signal received</text>';

  /* ── Dimension arrows ── */

  var arrY2 = earthY + 58;

  s += '<line x1="' + skipStartX + '" y1="' + (earthY + 2) + '" x2="' + skipStartX + '" y2="' + (arrY1 + 6) + '" stroke="' + dimTxt + '" stroke-width="0.5" stroke-dasharray="3,3"/>';

  s += '<circle cx="' + skipEndX + '" cy="' + (earthY - 4) + '" r="4" fill="' + skyClr + '"/>';
  s += '<text x="' + skipEndX + '" y="' + (earthY + 18) + '" fill="' + labelTxt + '" font-size="11" font-weight="600" text-anchor="middle">RX</text>';

  s += '</svg>';
  return s;
}

/* ── Day/Night World Map ──────────────────────────────────── */
function buildWorldMap() {
  const lt = isLight();
  const w = 900, h = 440;
  const now = new Date();

  /* calculate subsolar point */
  const dayOfYear = Math.floor((now - new Date(now.getFullYear(),0,0)) / 86400000);
  const declination = -23.44 * Math.cos(2 * Math.PI / 365 * (dayOfYear + 10));
  const utcHours = now.getUTCHours() + now.getUTCMinutes() / 60;
  const subsolarLon = (12 - utcHours) * 15;

  /* equirectangular projection */
  const mapL = 50, mapR = w - 20, mapT = 38, mapB = h - 30;
  function lonLatToXY(lon, lat) {
    const x = mapL + (lon + 180) / 360 * (mapR - mapL);
    const y = mapT + (90 - lat) / 180 * (mapB - mapT);
    return [x, y];
  }

  let svg = '<div class="prop-section"><h3>Current Day/Night Terminator — ' +
    now.toUTCString().replace(/ GMT$/, ' UTC') + '</h3>' +
    '<div class="world-map-wrap"><svg viewBox="0 0 ' + w + ' ' + h + '">';

  /* background */
  svg += '<rect x="0" y="0" width="' + w + '" height="' + h + '" fill="' + (lt?'#f0f2f6':'#0a0c14') + '" rx="4"/>';

  /* map area background — daytime base fill */
  svg += '<rect x="' + mapL + '" y="' + mapT + '" width="' + (mapR-mapL) + '" height="' + (mapB-mapT) + '" fill="' + (lt?'#e8eef8':'#0c1220') + '"/>';

  /* ── Grid lines (every 15° = 1 timezone) ── */
  for (let lon = -180; lon <= 180; lon += 15) {
    const [x] = lonLatToXY(lon, 0);
    const isMajor = lon % 30 === 0;
    svg += '<line x1="' + x + '" y1="' + mapT + '" x2="' + x + '" y2="' + mapB + '" stroke="' + (lt?'#c8cdd8':'#161c28') + '" stroke-width="' + (isMajor ? '0.6' : '0.3') + '"/>';
  }
  for (let lat = -90; lat <= 90; lat += 15) {
    const [, y] = lonLatToXY(0, lat);
    const isMajor = lat % 30 === 0;
    if (y >= mapT && y <= mapB)
      svg += '<line x1="' + mapL + '" y1="' + y + '" x2="' + mapR + '" y2="' + y + '" stroke="' + (lt?'#c8cdd8':'#161c28') + '" stroke-width="' + (isMajor ? '0.6' : '0.3') + '"/>';
  }
  /* equator */
  var [,eqY] = lonLatToXY(0,0);
  svg += '<line x1="' + mapL + '" y1="' + eqY + '" x2="' + mapR + '" y2="' + eqY + '" stroke="' + (lt?'#a0a8b8':'#2a3040') + '" stroke-width="0.8" stroke-dasharray="4,3"/>';

  /* latitude axis labels */
  [-60,-30,0,30,60].forEach(function(lat){
    var xy = lonLatToXY(-180, lat);
    svg += '<text x="' + (mapL - 4) + '" y="' + (xy[1]+3) + '" fill="' + (lt?'#5a6878':'#7a8a9e') + '" font-size="8" text-anchor="end">' + (lat > 0 ? lat+'°N' : lat < 0 ? (-lat)+'°S' : 'EQ') + '</text>';
  });

  /* ── Timezone labels at top ── */
  for (let lon = -180; lon <= 180; lon += 15) {
    const [x] = lonLatToXY(lon, 0);
    const utcOff = lon / 15;
    const label = utcOff === 0 ? 'UTC' : (utcOff > 0 ? '+' + utcOff : '' + utcOff);
    svg += '<text x="' + x + '" y="' + (mapT - 4) + '" fill="' + (lt?'#7a8898':'#5a6a80') + '" font-size="7" text-anchor="middle">' + label + '</text>';
  }
  /* longitude labels at bottom */
  for (let lon = -180; lon <= 180; lon += 30) {
    const [x] = lonLatToXY(lon, 0);
    svg += '<text x="' + x + '" y="' + (mapB + 14) + '" fill="' + (lt?'#5a6878':'#7a8a9e') + '" font-size="8" text-anchor="middle">' + (lon === 0 ? '0°' : lon > 0 ? lon + '°E' : (-lon) + '°W') + '</text>';
  }

  /* ── Compute terminator ── */
  const nightPoints = [];
  for (let lon = -180; lon <= 180; lon += 2) {
    const hourAngle = (lon - subsolarLon) * Math.PI / 180;
    const decRad = declination * Math.PI / 180;
    const termLat = Math.atan(-Math.cos(hourAngle) / Math.tan(decRad)) * 180 / Math.PI;
    nightPoints.push({ lon: lon, lat: termLat });
  }

  /* FIX: night is on the opposite side from the subsolar point */
  const nightIsNorth = declination < 0;

  /* ── Night polygon — darker fill ── */
  let nightPath = '';
  if (nightIsNorth) {
    nightPath = 'M' + lonLatToXY(-180, 90).join(',');
    nightPoints.forEach(function(p){ var c = lonLatToXY(p.lon, p.lat); nightPath += ' L' + c[0] + ',' + c[1]; });
    nightPath += ' L' + lonLatToXY(180, 90).join(',') + ' Z';
  } else {
    nightPath = 'M' + lonLatToXY(-180, -90).join(',');
    nightPoints.forEach(function(p){ var c = lonLatToXY(p.lon, p.lat); nightPath += ' L' + c[0] + ',' + c[1]; });
    nightPath += ' L' + lonLatToXY(180, -90).join(',') + ' Z';

  svg += '<path d="' + nightPath + '" fill="' + (lt?'#8898b0':'#000310') + '" opacity="' + (lt?'0.40':'0.65') + '"/>';

  let dayPath = '';

  svg += '</svg></div>';

  /* legend */
  svg += '<div class="prop-legend">' +
    '<div class="prop-legend-item"><div class="prop-legend-swatch" style="background:' + (lt?'#cc7700':'#ffaa44') + '"></div>Terminator line</div>' +
    '<div class="prop-legend-item"><div class="prop-legend-swatch" style="background:' + (lt?'#8898b0':'#000310') + ';border:1px solid ' + (lt?'#6a7a8a':'#1a2a3a') + '"></div>Nighttime (sky wave active)</div>' +
    '<div class="prop-legend-item"><div class="prop-legend-swatch" style="background:' + (lt?'#f8f0d8':'#0e1830') + ';border:1px solid ' + (lt?'#c8cdd8':'#1a2a3a') + '"></div>Daytime (D-layer absorbs lower HF)</div>' +
    '<div class="prop-legend-item"><div class="prop-legend-swatch" style="background:' + (lt?'#8ab88a':'#1a2e1e') + '"></div>Land masses</div>' +
    '</div>';

  svg += '<p style="font-size:13px;color:' + (lt?'#4a5568':'#a8b4c2') + ';margin-top:6px">HF propagation on 7–30 MHz improves along nighttime paths where D-layer absorption is absent. ' +
    'Lower HF (3–7 MHz) works best for NVIS during day and medium-distance sky wave at night. ' +
    'VHF/UHF propagation is largely unaffected by ionosphere — line-of-sight dominates.</p>';

  svg += '</div>';
  return svg;
}

/* ── band vs propagation quick reference ──────────────────── */
function buildPropBandTable() {
  return '<div class="prop-section"><h3>Band ↔ Propagation Quick Reference</h3>' +
    '<table class="detail-table">' +
    row('VLF (15–30 kHz)', 'Ground wave follows Earth curvature. Penetrates seawater. Global range from single TX with multi-km antenna.') +
    row('LF (30–300 kHz)', 'Ground wave dominant. Stable 1 000+ km range. Time signals, LORAN, longwave broadcast. Slight sky wave at night.') +
    row('MF (300 kHz–3 MHz)', 'Ground wave ~100 km by day. Sky wave emerges at night extending range to 1 000+ km. AM broadcast sweet spot.') +
    row('HF (3–30 MHz)', 'Sky wave via F-layer. Range: intercontinental. Highly dependent on solar cycle, time of day, season. DX at night on lower HF; DX by day on upper HF.') +
    row('VHF (30–300 MHz)', 'Line of sight. Extended by tropo ducting, sporadic E (rare), meteor scatter, EME. FM broadcast, aviation, amateur 2 m.') +
    row('UHF (300 MHz–3 GHz)', 'Strictly line of sight. Building penetration varies. Cellular, WiFi, Bluetooth, GPS, satellite, radar. Rain fade negligible.') +
    row('SHF (3–5 GHz)', 'Line of sight. Needs directional antennas for distance. 5G mid-band, C-band satellite, weather radar. Rain fade begins to be measurable.') +
    '</table></div>';
}

/* ── ripple effect on click ──────────────────────────────── */
document.addEventListener('click', e => {
  const btn = e.target.closest('.band-btn, .sub-btn, .bc-btn, .calc-btn, .search-btn');
  if (!btn) return;
  const rect = btn.getBoundingClientRect();
  const size = Math.max(rect.width, rect.height);
  const rip = document.createElement('span');
  rip.className = 'ripple';
  rip.style.width = rip.style.height = size + 'px';
  rip.style.left = (e.clientX - rect.left - size/2) + 'px';
  rip.style.top  = (e.clientY - rect.top - size/2) + 'px';
  btn.style.position = 'relative';
  btn.style.overflow = 'hidden';
  btn.appendChild(rip);
  rip.addEventListener('animationend', () => rip.remove());
});

/* ── UTC clock ────────────────────────────────────────────── */
function updateClock() {
  const now = new Date();
  const h = String(now.getUTCHours()).padStart(2,'0');
  const m = String(now.getUTCMinutes()).padStart(2,'0');
  const s = String(now.getUTCSeconds()).padStart(2,'0');
  const el = document.getElementById('utcClock');
  if (el) el.textContent = h + ':' + m + ':' + s + ' UTC';
}
updateClock();
setInterval(updateClock, 1000);

/* ── global search input listeners ───────────────────────── */
(function(){
  const gs = document.getElementById('globalSearch');
  if (!gs) return;
  gs.addEventListener('keydown', e => {
    if (e.key === 'Enter') {
      const q = gs.value.trim();
      if (q) openSearch(q);
    }
    if (e.key === 'Escape') {
      gs.value = '';
      gs.blur();
    }
  });
  gs.addEventListener('input', () => {
    const q = gs.value.trim();
    if (q.length >= 2) openSearch(q);
  });
})();

/* ── keyboard nav ─────────────────────────────────────────── */
document.addEventListener('keydown', e => {
  /* '/' focuses global search (unless already focused) */
  if (e.key === '/' && document.activeElement !== document.getElementById('globalSearch')) {
    e.preventDefault();
    document.getElementById('globalSearch').focus();
    return;
  }

  const allTabs = [
    ...BANDS.map(b => ({ type:'band', data:b })),
    { type:'glossary' },
    { type:'propagation' },
    { type:'broadcast' },
    { type:'calc' },
    { type:'search' }
  ];

  /* find current tab index */
  let curIdx = -1;
  if      (activeView === 'glossary')    curIdx = BANDS.length;
  else if (activeView === 'propagation') curIdx = BANDS.length + 1;
  else if (activeView === 'broadcast')   curIdx = BANDS.length + 2;
  else if (activeView === 'calc')        curIdx = BANDS.length + 3;
  else if (activeView === 'search')      curIdx = BANDS.length + 4;
  else if (activeView === 'band')        curIdx = BANDS.findIndex(b => b.id === activeBand);

  const isArrow = ['ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.key);
  if (!isArrow) return;

  /* ── Sub-band level: a sub is active ── */
  if (activeView === 'band' && activeSub) {
    e.preventDefault();
    /* Left: escape back to band level */
    if (e.key === 'ArrowLeft') {
      activeSub = null;
      document.querySelectorAll('.sub-btn').forEach(el => el.classList.remove('active'));
      $('#detailInner').style.display = 'none';
      $('#emptyState').style.display = 'flex';
      $('#emptyState').className = 'empty-state';
      $('#emptyState').innerHTML = '← Select a sub\u2011band';
      return;
    }
    const band = BANDS.find(b => b.id === activeBand);
    if (band) {
      const subs = band.subs;
      let subIdx = subs.findIndex(s => s.name === activeSub);
      if (e.key === 'ArrowDown' || e.key === 'ArrowRight') subIdx = Math.min(subIdx + 1, subs.length - 1);
      else subIdx = Math.max(subIdx - 1, 0); /* ArrowUp */
      const subBtns = document.querySelectorAll('#subInner .sub-btn');
      if (subBtns[subIdx]) selectSub(band, subs[subIdx], subBtns[subIdx]);
    }
    return;
  }

  /* ── Top-level nav: Up / Down ── */
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
    if (curIdx < 0) return;
    e.preventDefault();
    let next = e.key === 'ArrowDown' ? curIdx + 1 : curIdx - 1;
    next = Math.max(0, Math.min(next, allTabs.length - 1));
    const tab = allTabs[next];
    if      (tab.type === 'glossary')    openGlossary();
    else if (tab.type === 'propagation') openPropagation();
    else if (tab.type === 'broadcast')   openBroadcast();
    else if (tab.type === 'calc')        openCalc();
    else if (tab.type === 'search')      openSearch('');
    else                                 selectBand(tab.data);
  }

  /* ── Band level: Right enters first sub-band ── */
  if (e.key === 'ArrowRight' && activeView === 'band' && !activeSub) {
    const band = BANDS.find(b => b.id === activeBand);
    if (!band) return;
    e.preventDefault();
    const subBtns = document.querySelectorAll('#subInner .sub-btn');
    if (subBtns[0]) selectSub(band, band.subs[0], subBtns[0]);
  }
});
</script>
